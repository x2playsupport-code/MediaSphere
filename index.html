<!DOCTYPE html>
<html lang="he" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MediaSphere - פלטפורמת מדיה בלעדית</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cyan: '#00f2fe',
                            purple: '#4facfe',
                            pink: '#f72585',
                            dark: '#0a0b10',
                            card: 'rgba(18, 20, 29, 0.75)'
                        }
                    },
                    fontFamily: {
                        sans: ['Rubik', 'Heebo', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0b10;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(247, 37, 133, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .glass-card {
            background: rgba(18, 20, 29, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .glass-input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            outline: none;
        }

        .neon-btn {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #0a0b10;
            font-weight: 800;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            transition: all 0.2s ease;
        }

        .neon-btn:active {
            transform: scale(0.97);
        }

        .toast-enter {
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast-show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen font-sans">

    <!-- Header Section -->
    <header class="sticky top-0 z-50 glass-card border-b border-gray-800 bg-gray-950/80 backdrop-blur-xl px-4 py-3 sm:px-8">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-cyan via-brand-purple to-brand-pink p-0.5 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <div class="w-full h-full bg-gray-950 rounded-[14px] flex items-center justify-center">
                        <i class="fa-solid fa-bolt text-brand-cyan text-lg"></i>
                    </div>
                </div>
                <span class="text-xl sm:text-2xl font-black tracking-wider bg-gradient-to-r from-white via-cyan-200 to-pink-400 bg-clip-text text-transparent">
                    MediaSphere
                </span>
            </div>

            <!-- User Auth Bar -->
            <div id="authContainer" class="flex items-center gap-3">
                <!-- Dynamic Content via JS -->
                <button onclick="loginWithGoogle()" class="px-4 py-2 rounded-xl bg-gray-900 hover:bg-gray-800 text-white border border-gray-700 font-bold text-xs sm:text-sm flex items-center gap-2 transition-all active:scale-95">
                    <i class="fa-brands fa-google text-red-400"></i>
                    <span>התחבר עם גוגל</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 space-y-8">

        <!-- Admin Only Banner Notice (Visible only if admin is logged in) -->
        <div id="adminBadge" class="hidden glass-card rounded-2xl p-4 border border-brand-cyan/40 bg-cyan-950/20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-brand-cyan/20 text-brand-cyan flex items-center justify-center font-bold">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h4 class="text-sm font-bold text-white">מצב מנהל מורשה פעיל</h4>
                    <p class="text-xs text-gray-400">יש לך הרשאות מלאות להעלות ולמחוק סרטונים ותמונות באתר</p>
                </div>
            </div>
            <span class="text-[11px] font-bold bg-brand-cyan/20 text-brand-cyan px-2.5 py-1 rounded-full border border-brand-cyan/30">ADMIN</span>
        </div>

        <!-- Upload Form Container (Admin ONLY) -->
        <section id="uploadSection" class="hidden glass-card rounded-3xl p-5 sm:p-7 border border-brand-cyan/30 relative">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-base sm:text-lg font-bold flex items-center gap-2 text-white">
                    <i class="fa-solid fa-cloud-arrow-up text-brand-cyan"></i>
                    העלאת סרטון/תמונה (מנהלים)
                </h2>
                <span id="fileCounterText" class="text-xs text-cyan-300 bg-cyan-950/80 px-2.5 py-1 rounded-full border border-cyan-500/30 font-medium">0/5 קבצים</span>
            </div>

            <input type="file" id="fileInput" multiple accept="image/*,video/*" class="hidden" onchange="handleFileSelect(event)">

            <div onclick="document.getElementById('fileInput').click()" 
                 class="border-2 border-dashed border-gray-700 hover:border-brand-cyan/80 rounded-2xl p-6 sm:p-8 text-center cursor-pointer bg-gray-900/40 hover:bg-gray-900/80 transition-all duration-300">
                <div class="flex flex-col items-center justify-center gap-2">
                    <div class="w-12 h-12 rounded-2xl bg-brand-cyan/10 flex items-center justify-center text-brand-cyan text-2xl">
                        <i class="fa-solid fa-photo-film"></i>
                    </div>
                    <p class="text-sm sm:text-base font-bold text-gray-200">לחץ לבחירת סרטונים/תמונות מהמכשיר</p>
                    <p class="text-xs text-gray-400">עד 5 קבצים בכל פעם</p>
                </div>
            </div>

            <!-- Preview Grid -->
            <div id="previewContainer" class="grid grid-cols-2 sm:grid-cols-5 gap-3 mt-4 hidden"></div>

            <div class="mt-4">
                <textarea id="postDescription" rows="2" placeholder="כתוביות/תיאור לסרטון..." class="w-full glass-input rounded-2xl p-3.5 text-sm placeholder-gray-500 resize-none focus:ring-2 focus:ring-brand-cyan"></textarea>
            </div>

            <div class="mt-4 flex items-center justify-end gap-3">
                <button onclick="clearUploadForm()" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 font-medium text-xs">איפוס</button>
                <button onclick="publishPost()" class="neon-btn px-6 py-2.5 rounded-xl font-bold text-xs sm:text-sm shadow-lg flex items-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    פרסם באתר לכולם
                </button>
            </div>
        </section>

        <!-- Guest Banner (Visible when user is guest or non-admin) -->
        <div id="guestNotice" class="glass-card rounded-2xl p-4 text-center border border-gray-800">
            <p class="text-xs sm:text-sm text-gray-300">
                <i class="fa-solid fa-circle-info text-brand-cyan ml-1"></i>
                כל המבקרים באתר יכולים לצפות ולהוריד את התכנים למכשיר באופן חופשי.
            </p>
        </div>

        <!-- Posts Feed Section -->
        <div class="flex items-center justify-between border-b border-gray-800 pb-3">
            <h3 class="text-base font-bold text-gray-200 flex items-center gap-2">
                <i class="fa-solid fa-layer-group text-brand-pink"></i>
                פיד הסרטונים והמדיה
            </h3>
            <span id="postsCount" class="text-xs text-gray-400">0 פוסטים</span>
        </div>

        <section id="postsFeed" class="space-y-6">
            <!-- Dynamic Posts from Firestore / Data -->
        </section>

    </main>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 left-5 sm:left-auto sm:w-80 z-50 space-y-3 pointer-events-none"></div>

    <!-- Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration fallback or window environment
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDemoConfigKeyForMediaSphereApp",
            authDomain: "mediasphere-app.firebaseapp.com",
            projectId: "mediasphere-app",
            storageBucket: "mediasphere-app.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        const ALLOWED_ADMIN_EMAILS = [
            "x2playsupport@gmail.com",
            "osheri.groberman16@gmail.com"
        ];

        let app, auth, db;
        let currentUser = null;
        let isAdmin = false;
        let selectedFiles = [];
        let postsList = [];

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'mediasphere-default';

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.warn("Firebase initialization notice:", e);
        }

        // Firebase Auth Listener
        if (auth) {
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                checkAdminPermissions();
                updateAuthUI();
            });
        }

        function checkAdminPermissions() {
            if (currentUser && currentUser.email) {
                const userEmail = currentUser.email.toLowerCase().trim();
                isAdmin = ALLOWED_ADMIN_EMAILS.some(email => email.toLowerCase() === userEmail);
            } else {
                isAdmin = false;
            }

            // Toggle Admin UIs
            const uploadSection = document.getElementById('uploadSection');
            const adminBadge = document.getElementById('adminBadge');

            if (isAdmin) {
                uploadSection.classList.remove('hidden');
                adminBadge.classList.remove('hidden');
            } else {
                uploadSection.classList.add('hidden');
                adminBadge.classList.add('hidden');
            }

            renderPosts();
        }

        function updateAuthUI() {
            const container = document.getElementById('authContainer');
            if (currentUser) {
                container.innerHTML = `
                    <div class="flex items-center gap-2">
                        <img src="${currentUser.photoURL || 'https://via.placeholder.com/40'}" class="w-8 h-8 rounded-full border border-brand-cyan object-cover">
                        <span class="text-xs font-bold text-gray-200 hidden sm:inline">${currentUser.displayName || currentUser.email}</span>
                        <button id="logoutBtn" class="px-3 py-1.5 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 text-xs font-bold transition-all">
                            התנתק
                        </button>
                    </div>
                `;
                document.getElementById('logoutBtn')?.addEventListener('click', handleLogout);
            } else {
                container.innerHTML = `
                    <button id="loginBtn" class="px-4 py-2 rounded-xl bg-gray-900 hover:bg-gray-800 text-white border border-gray-700 font-bold text-xs sm:text-sm flex items-center gap-2 transition-all active:scale-95">
                        <i class="fa-brands fa-google text-red-400"></i>
                        <span>התחבר עם גוגל</span>
                    </button>
                `;
                document.getElementById('loginBtn')?.addEventListener('click', loginWithGoogle);
            }
        }

        async function loginWithGoogle() {
            if (!auth) {
                showToast('חיבור Firebase אינו זמין כעת', 'error');
                return;
            }
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                showToast('התחברת בהצלחה!', 'success');
            } catch (error) {
                console.error("Login error:", error);
                showToast('שגיאה בהתחברות עם גוגל', 'error');
            }
        }

        async function handleLogout() {
            if (auth) {
                await signOut(auth);
                showToast('התנתקת מהמערכת', 'info');
            }
        }

        // Firestore Realtime Listener
        function initFirestoreListener() {
            if (!db) {
                loadLocalFallbackPosts();
                return;
            }

            try {
                const postsRef = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
                onSnapshot(postsRef, (snapshot) => {
                    postsList = [];
                    snapshot.forEach((docSnap) => {
                        postsList.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    
                    // Sort descending by timestamp
                    postsList.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    renderPosts();
                }, (error) => {
                    console.warn("Firestore snapshot error, switching to browser storage:", error);
                    loadLocalFallbackPosts();
                });
            } catch (err) {
                loadLocalFallbackPosts();
            }
        }

        function loadLocalFallbackPosts() {
            const saved = localStorage.getItem('mediasphere_public_posts');
            postsList = saved ? JSON.parse(saved) : [];
            renderPosts();
        }

        function saveLocalFallbackPosts() {
            localStorage.setItem('mediasphere_public_posts', JSON.stringify(postsList));
        }

        // File Selection
        window.handleFileSelect = function(e) {
            const files = Array.from(e.target.files || []);
            if (selectedFiles.length + files.length > 5) {
                showToast('ניתן להעלות עד 5 קבצים בלבד!', 'error');
                return;
            }

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    selectedFiles.push({
                        url: event.target.result,
                        type: file.type.startsWith('video/') ? 'video' : 'image',
                        name: file.name || 'file'
                    });
                    updatePreviews();
                };
                reader.readAsDataURL(file);
            });
        };

        function updatePreviews() {
            const container = document.getElementById('previewContainer');
            const counter = document.getElementById('fileCounterText');
            counter.innerText = `${selectedFiles.length}/5 קבצים`;

            if (selectedFiles.length === 0) {
                container.classList.add('hidden');
                container.innerHTML = '';
                return;
            }

            container.classList.remove('hidden');
            container.innerHTML = '';

            selectedFiles.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'relative rounded-xl overflow-hidden aspect-square border border-gray-700 bg-black';
                div.innerHTML = `
                    ${item.type === 'video' 
                        ? `<video src="${item.url}" class="w-full h-full object-cover"></video>` 
                        : `<img src="${item.url}" class="w-full h-full object-cover">`}
                    <button onclick="removeSelectedFile(${idx})" class="absolute top-1 left-1 bg-red-600 text-white w-6 h-6 rounded-full text-xs flex items-center justify-center">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        window.removeSelectedFile = function(idx) {
            selectedFiles.splice(idx, 1);
            updatePreviews();
        };

        window.clearUploadForm = function() {
            selectedFiles = [];
            document.getElementById('fileInput').value = '';
            document.getElementById('postDescription').value = '';
            updatePreviews();
        };

        window.publishPost = async function() {
            if (!isAdmin) {
                showToast('אין לך הרשאות מנהל להעלות תכנים!', 'error');
                return;
            }

            const desc = document.getElementById('postDescription').value.trim();
            if (selectedFiles.length === 0 && !desc) {
                showToast('נא לבחור קובץ מדיה או לכתוב תיאור', 'error');
                return;
            }

            const newPost = {
                description: desc,
                media: selectedFiles,
                author: currentUser?.email || 'מנהל MediaSphere',
                timestamp: Date.now(),
                formattedDate: new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) + ' ' + new Date().toLocaleDateString('he-IL')
            };

            if (db) {
                try {
                    const postsRef = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
                    await addDoc(postsRef, newPost);
                    showToast('הפוסט עלה בהצלחה לשרת!', 'success');
                } catch (e) {
                    console.error("Firestore add error:", e);
                    postsList.unshift({ id: 'local-' + Date.now(), ...newPost });
                    saveLocalFallbackPosts();
                    renderPosts();
                    showToast('הפוסט פורסם מקומית', 'success');
                }
            } else {
                postsList.unshift({ id: 'local-' + Date.now(), ...newPost });
                saveLocalFallbackPosts();
                renderPosts();
                showToast('הפוסט פורסם מקומית', 'success');
            }

            clearUploadForm();
        };

        window.deletePost = async function(postId) {
            if (!isAdmin) {
                showToast('רק מנהלים מורשים למחוק פוסטים!', 'error');
                return;
            }

            if (db && !postId.startsWith('local-')) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'posts', postId);
                    await deleteDoc(docRef);
                    showToast('הפוסט נמחק בהצלחה!', 'info');
                } catch (e) {
                    console.error("Delete error:", e);
                }
            } else {
                postsList = postsList.filter(p => p.id !== postId);
                saveLocalFallbackPosts();
                renderPosts();
                showToast('הפוסט נמחק', 'info');
            }
        };

        function renderPosts() {
            const feed = document.getElementById('postsFeed');
            const countEl = document.getElementById('postsCount');
            feed.innerHTML = '';

            countEl.innerText = `${postsList.length} פוסטים`;

            if (postsList.length === 0) {
                feed.innerHTML = `
                    <div class="glass-card rounded-3xl p-10 text-center text-gray-400">
                        <i class="fa-solid fa-film text-4xl mb-3 text-brand-cyan"></i>
                        <p class="font-bold text-gray-200">אין עדיין סרטונים או תמונות באתר</p>
                        <p class="text-xs text-gray-400 mt-1">מנהלי האתר יעלו תכנים חדשים בקרוב!</p>
                    </div>
                `;
                return;
            }

            postsList.forEach(post => {
                const card = document.createElement('article');
                card.className = 'glass-card rounded-3xl overflow-hidden border border-gray-800';

                let deleteBtnHtml = '';
                if (isAdmin) {
                    deleteBtnHtml = `
                        <button onclick="deletePost('${post.id}')" title="מחק פוסט" class="px-3 py-1.5 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 font-semibold text-xs flex items-center gap-1.5 transition-all active:scale-95">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>מחק</span>
                        </button>
                    `;
                }

                let mediaGridHtml = '';
                if (post.media && post.media.length > 0) {
                    const mediaItems = post.media.map(m => `
                        <div class="relative group rounded-2xl overflow-hidden bg-black aspect-video sm:aspect-square flex items-center justify-center border border-gray-800">
                            ${m.type === 'video' 
                                ? `<video src="${m.url}" controls playsinline class="w-full h-full object-contain"></video>` 
                                : `<img src="${m.url}" class="w-full h-full object-contain">`}
                            
                            <a href="${m.url}" download="${m.name || 'media'}" class="absolute top-2.5 left-2.5 bg-gray-950/80 hover:bg-brand-cyan hover:text-black text-white px-3 py-1.5 rounded-xl backdrop-blur-md transition-all text-xs font-bold flex items-center gap-1.5 shadow">
                                <i class="fa-solid fa-download"></i>
                                <span>הורד</span>
                            </a>
                        </div>
                    `).join('');

                    mediaGridHtml = `<div class="grid grid-cols-1 ${post.media.length > 1 ? 'sm:grid-cols-2' : ''} gap-3 p-3 bg-black/40">${mediaItems}</div>`;
                }

                card.innerHTML = `
                    <div class="p-4 flex items-center justify-between border-b border-gray-800">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-brand-cyan to-brand-pink flex items-center justify-center font-bold text-black text-xs">
                                MS
                            </div>
                            <div>
                                <h4 class="font-bold text-xs sm:text-sm text-white">${post.author || 'MediaSphere'}</h4>
                                <span class="text-[11px] text-gray-400">${post.formattedDate || ''}</span>
                            </div>
                        </div>
                        ${deleteBtnHtml}
                    </div>
                    ${post.description ? `<div class="px-5 py-3 text-sm text-gray-200">${post.description}</div>` : ''}
                    ${mediaGridHtml}
                `;

                feed.appendChild(card);
            });
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let color = 'border-brand-cyan text-brand-cyan';
            if (type === 'success') color = 'border-emerald-500 text-emerald-400';
            if (type === 'error') color = 'border-red-500 text-red-400';

            toast.className = `toast-enter p-3.5 rounded-2xl border shadow-2xl glass-card flex items-center gap-2.5 bg-gray-950 ${color}`;
            toast.innerHTML = `
                <i class="fa-solid fa-circle-info"></i>
                <span class="text-xs font-semibold text-gray-100">${msg}</span>
            `;

            container.appendChild(toast);
            setTimeout(() => toast.classList.add('toast-show'), 10);
            setTimeout(() => {
                toast.classList.remove('toast-show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Initialize App
        window.loginWithGoogle = loginWithGoogle;
        initFirestoreListener();
    </script>
</body>
</html>
