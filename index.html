<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaSphere - השחלת מדיה ושיתוף</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0a0b10;
            --glass-bg: rgba(18, 20, 29, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f2fe;
            --accent-purple: #4facfe;
            --accent-pink: #f72585;
            --text-main: #ffffff;
            --text-muted: #8a8f9d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(247, 37, 133, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(10, 11, 16, 0.8);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 1.5rem;
        }

        .header-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo i {
            color: var(--accent-cyan);
            -webkit-text-fill-color: initial;
        }

        .main-container {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1rem 5rem 1rem;
        }

        .upload-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 1rem;
        }

        .upload-area:active, .upload-area.dragover {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.05);
        }

        .upload-icon {
            font-size: 2.5rem;
            color: var(--accent-cyan);
            margin-bottom: 0.5rem;
        }

        .previews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            margin-bottom: 1rem;
        }

        .preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }

        .preview-item img, .preview-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            color: #ff4757;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            resize: none;
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 1rem;
        }

        textarea:focus {
            border-color: var(--accent-cyan);
        }

        .post-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-purple));
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .post-btn:active {
            transform: scale(0.98);
        }

        /* Feed Styles */
        .feed-item {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .media-slider {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            margin: 1rem 0;
            padding-bottom: 8px;
        }

        .media-slider::-webkit-scrollbar {
            height: 4px;
        }

        .media-slider::-webkit-scrollbar-thumb {
            background: var(--accent-cyan);
            border-radius: 10px;
        }

        .media-box {
            flex: 0 0 100%;
            scroll-snap-align: start;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            max-height: 450px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-box img, .media-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-height: 450px;
        }

        .download-btn {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .download-btn:active {
            background: var(--accent-cyan);
            color: #000;
        }

        .post-caption {
            margin-top: 10px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        /* Hidden Input */
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">
                <i class="fa-solid fa-circle-nodes"></i> MediaSphere
            </div>
        </div>
    </header>

    <div class="main-container">
        
        <!-- Upload Card -->
        <div class="upload-card">
            <!-- accept="image/*,video/*" ensures gallery option opens on phones -->
            <input type="file" id="fileInput" multiple accept="image/*,video/*">
            
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <h3>לחץ לבחירה מהגלריה</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">תמונות או סרטונים (עד 5 קבצים)</p>
            </div>

            <div class="previews-grid" id="previewsGrid"></div>

            <textarea id="captionInput" rows="2" placeholder="כתוב משהו על הסרטון/התמונה..."></textarea>
            
            <button class="post-btn" onclick="createPost()">
                <i class="fa-solid fa-paper-plane"></i> פרסם באתר
            </button>
        </div>

        <!-- Feed Section -->
        <div id="feedList"></div>

    </div>

    <script>
        let selectedFiles = [];
        const fileInput = document.getElementById('fileInput');
        const previewsGrid = document.getElementById('previewsGrid');
        const feedList = document.getElementById('feedList');

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            
            if (selectedFiles.length + files.length > 5) {
                alert('ניתן להעלות עד 5 קבצים בלבד בכל פעם!');
                return;
            }

            files.forEach(file => {
                if (selectedFiles.length < 5) {
                    selectedFiles.push(file);
                }
            });

            renderPreviews();
            fileInput.value = ''; // Reset input
        });

        function renderPreviews() {
            previewsGrid.innerHTML = '';
            selectedFiles.forEach((file, idx) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                
                const url = URL.createObjectURL(file);
                const isVideo = file.type.startsWith('video/');

                if (isVideo) {
                    div.innerHTML = `<video src="${url}"></video>`;
                } else {
                    div.innerHTML = `<img src="${url}">`;
                }

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                removeBtn.onclick = () => {
                    selectedFiles.splice(idx, 1);
                    renderPreviews();
                };

                div.appendChild(removeBtn);
                previewsGrid.appendChild(div);
            });
        }

        function createPost() {
            const caption = document.getElementById('captionInput').value;
            if (selectedFiles.length === 0 && !caption.trim()) {
                alert('יש להעלות לפחות קובץ אחד או לכתוב טקסט.');
                return;
            }

            const postCard = document.createElement('div');
            postCard.className = 'feed-item';

            let mediaHTML = '';
            if (selectedFiles.length > 0) {
                mediaHTML = '<div class="media-slider">';
                selectedFiles.forEach(file => {
                    const url = URL.createObjectURL(file);
                    const isVideo = file.type.startsWith('video/');
                    const fileName = file.name || (isVideo ? 'video.mp4' : 'image.png');

                    mediaHTML += `
                        <div class="media-box">
                            ${isVideo 
                                ? `<video src="${url}" controls></video>` 
                                : `<img src="${url}">`
                            }
                            <a href="${url}" download="${fileName}" class="download-btn">
                                <i class="fa-solid fa-download"></i> שמור/הורד
                            </a>
                        </div>
                    `;
                });
                mediaHTML += '</div>';
            }

            postCard.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                    <div style="width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(45deg, var(--accent-pink), var(--accent-cyan)); display: flex; align-items: center; justify-content: center; font-weight: bold;">U</div>
                    <div>
                        <div style="font-weight: 700; font-size: 0.95rem;">משתמש MediaSphere</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">עכשיו</div>
                    </div>
                </div>
                ${mediaHTML}
                ${caption ? `<div class="post-caption">${caption}</div>` : ''}
            `;

            feedList.prepend(postCard);

            // Reset Form
            selectedFiles = [];
            renderPreviews();
            document.getElementById('captionInput').value = '';
        }
    </script>
</body>
</html>
