<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaSphere - השלם, שתף והורד</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0a0b10;
            --glass-bg: rgba(18, 20, 29, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f2fe;
            --accent-purple: #4facfe;
            --accent-pink: #f72585;
            --text-main: #ffffff;
            --text-muted: #8a8f9d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(247, 37, 133, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(10, 11, 16, 0.85);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 1.5rem;
        }

        .header-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0,242,254,0.3);
        }

        .logo i {
            color: var(--accent-cyan);
            -webkit-text-fill-color: initial;
            filter: drop-shadow(0 0 10px var(--accent-cyan));
        }

        .main-container {
            max-width: 680px;
            margin: 2rem auto;
            padding: 0 1rem 6rem 1rem;
        }

        /* Upload Card */
        .upload-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.8rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        .upload-area {
            border: 2px dashed rgba(0, 242, 254, 0.3);
            border-radius: 18px;
            padding: 2.2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(0, 242, 254, 0.02);
            margin-bottom: 1.2rem;
        }

        .upload-area:hover, .upload-area:active {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.06);
            box-shadow: 0 0 20px rgba(0,242,254,0.15);
        }

        .upload-icon {
            font-size: 2.8rem;
            color: var(--accent-cyan);
            margin-bottom: 0.8rem;
            filter: drop-shadow(0 0 10px rgba(0,242,254,0.4));
        }

        .upload-area h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .previews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
            gap: 10px;
            margin-bottom: 1.2rem;
        }

        .preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            background: #000;
        }

        .preview-item img, .preview-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.75);
            color: #ff4757;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: transform 0.2s;
        }

        .remove-btn:active {
            transform: scale(0.9);
        }

        textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px;
            color: #fff;
            resize: none;
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 1.2rem;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0,242,254,0.1);
        }

        .post-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #0a0b10;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,242,254,0.3);
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .post-btn:active {
            transform: scale(0.98);
        }

        /* Feed Card Styles */
        .feed-item {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1rem;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            color: #fff;
            box-shadow: 0 0 15px rgba(247,37,133,0.3);
        }

        .media-slider {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            margin: 1rem 0;
            padding-bottom: 10px;
        }

        .media-slider::-webkit-scrollbar {
            height: 6px;
        }

        .media-slider::-webkit-scrollbar-thumb {
            background: var(--accent-cyan);
            border-radius: 10px;
        }

        .media-box {
            flex: 0 0 100%;
            scroll-snap-align: start;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            max-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
        }

        .media-box img, .media-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-height: 500px;
        }

        .download-btn {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(10, 11, 16, 0.85);
            backdrop-filter: blur(10px);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 20px rgba(0,242,254,0.25);
            transition: all 0.2s;
        }

        .download-btn:active {
            background: var(--accent-cyan);
            color: #0a0b10;
        }

        .post-caption {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 1rem;
            word-break: break-word;
        }

        .post-actions {
            display: flex;
            gap: 20px;
            border-top: 1px solid var(--glass-border);
            padding-top: 12px;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .action-btn.liked {
            color: var(--accent-pink);
        }

        .action-btn:hover {
            color: var(--text-main);
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">
                <i class="fa-solid fa-bolt"></i> MediaSphere
            </div>
        </div>
    </header>

    <div class="main-container">
        
        <!-- Upload Card -->
        <div class="upload-card">
            <input type="file" id="fileInput" multiple accept="image/*,video/*">
            
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">
                    <i class="fa-solid fa-photo-film"></i>
                </div>
                <h3>בחר סרטונים או תמונות מהגלריה</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 6px;">תומך בעד 5 קבצים בו-זמנית</p>
            </div>

            <div class="previews-grid" id="previewsGrid"></div>

            <textarea id="captionInput" rows="2" placeholder="מה תרצה לכתוב על הפוסט? #מדיה"></textarea>
            
            <button class="post-btn" onclick="createPost()">
                <i class="fa-solid fa-paper-plane"></i> פרסם לכולם באתר
            </button>
        </div>

        <!-- Feed List -->
        <div id="feedList">
            <!-- Sample Post -->
            <div class="feed-item">
                <div class="post-header">
                    <div class="avatar" style="background: linear-gradient(45deg, #00f2fe, #4facfe);">M</div>
                    <div>
                        <div style="font-weight: 700; font-size: 0.95rem;">MediaSphere Team</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">לפני דקה</div>
                    </div>
                </div>
                <div class="post-caption">ברוכים הבאים לפלטפורמה המטורפת ביותר לשיתוף מדיה! העלו סרטונים ותמונות, שמרו בלחיצה אחת מכל מכשיר 🚀🔥</div>
                <div class="post-actions">
                    <button class="action-btn" onclick="toggleLike(this)"><i class="fa-regular fa-heart"></i> <span>24</span></button>
                    <button class="action-btn"><i class="fa-regular fa-comment"></i> תגובות</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        let selectedFiles = [];
        const fileInput = document.getElementById('fileInput');
        const previewsGrid = document.getElementById('previewsGrid');
        const feedList = document.getElementById('feedList');

        // Handles file selection cleanly for PC and mobile (iOS/Android)
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            
            if (selectedFiles.length + files.length > 5) {
                alert('ניתן לבחור עד 5 קבצים בלבד בסך הכל!');
                fileInput.value = '';
                return;
            }

            files.forEach(file => {
                if (selectedFiles.length < 5) {
                    selectedFiles.push(file);
                }
            });

            renderPreviews();
        });

        function renderPreviews() {
            previewsGrid.innerHTML = '';
            selectedFiles.forEach((file, idx) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                
                const url = URL.createObjectURL(file);
                const isVideo = file.type.startsWith('video/');

                if (isVideo) {
                    div.innerHTML = `<video src="${url}"></video>`;
                } else {
                    div.innerHTML = `<img src="${url}">`;
                }

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                removeBtn.onclick = (event) => {
                    event.stopPropagation();
                    selectedFiles.splice(idx, 1);
                    renderPreviews();
                    // Clear file input cache so selecting same file again works
                    if (selectedFiles.length === 0) {
                        fileInput.value = '';
                    }
                };

                div.appendChild(removeBtn);
                previewsGrid.appendChild(div);
            });
        }

        function createPost() {
            const caption = document.getElementById('captionInput').value.trim();
            if (selectedFiles.length === 0 && !caption) {
                alert('אנא בחר לפחות קובץ אחד מהגלריה או כתוב טקסט לפוסט.');
                return;
            }

            const postCard = document.createElement('div');
            postCard.className = 'feed-item';

            let mediaHTML = '';
            if (selectedFiles.length > 0) {
                mediaHTML = '<div class="media-slider">';
                selectedFiles.forEach(file => {
                    const url = URL.createObjectURL(file);
                    const isVideo = file.type.startsWith('video/');
                    const fileName = file.name || (isVideo ? 'video.mp4' : 'image.png');

                    mediaHTML += `
                        <div class="media-box">
                            ${isVideo 
                                ? `<video src="${url}" controls playsinline></video>` 
                                : `<img src="${url}">`
                            }
                            <a href="${url}" download="${fileName}" class="download-btn">
                                <i class="fa-solid fa-download"></i> שמור/הורד
                            </a>
                        </div>
                    `;
                });
                mediaHTML += '</div>';
            }

            postCard.innerHTML = `
                <div class="post-header">
                    <div class="avatar">מש</div>
                    <div>
                        <div style="font-weight: 700; font-size: 0.95rem;">משתמש MediaSphere</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">עכשיו</div>
                    </div>
                </div>
                ${mediaHTML}
                ${caption ? `<div class="post-caption">${caption}</div>` : ''}
                <div class="post-actions">
                    <button class="action-btn" onclick="toggleLike(this)"><i class="fa-regular fa-heart"></i> <span>1</span></button>
                    <button class="action-btn"><i class="fa-regular fa-comment"></i> תגובות</button>
                </div>
            `;

            feedList.prepend(postCard);

            // Reset Form completely
            selectedFiles = [];
            fileInput.value = '';
            renderPreviews();
            document.getElementById('captionInput').value = '';
        }

        function toggleLike(btn) {
            btn.classList.toggle('liked');
            const icon = btn.querySelector('i');
            const span = btn.querySelector('span');
            let count = parseInt(span.textContent);

            if (btn.classList.contains('liked')) {
                icon.className = 'fa-solid fa-heart';
                span.textContent = count + 1;
            } else {
                icon.className = 'fa-regular fa-heart';
                span.textContent = count - 1;
            }
        }
    </script>
</body>
</html>
